# Continuous delivery. A merge from develop into main re-runs CI, builds the
# release, then deploys it. Deploy steps need the secrets listed in the README
# section "CI/CD"; a step with no secret set is skipped, not failed.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Install production server dependencies and generate Prisma client
        working-directory: server
        run: |
          npm ci --omit=dev
          npx prisma generate
        env:
          # prisma generate only reads the schema, so a placeholder URL is enough.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Package
        run: |
          mkdir release
          cp -r client/dist release/client
          mkdir release/server
          cp -r server/package.json server/package-lock.json server/prisma server/prisma.config.ts server/src release/server/
          tar -czf release.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Store DATABASE_URL and DEPLOY_HOOK_URL as secrets of this environment, limit its
    # deployment branches to main and add required reviewers. Each secret is passed
    # only to the one step that uses it.
    environment: production
    env:
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
      HAS_DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies without running package scripts
        if: env.HAS_DATABASE == 'true'
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Apply database migrations
        if: env.HAS_DATABASE == 'true'
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Trigger the hosting provider deploy hook
        if: env.HAS_DEPLOY_HOOK == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
      - name: Nothing to deploy to
        if: env.HAS_DATABASE != 'true' && env.HAS_DEPLOY_HOOK != 'true'
        run: echo "::notice::No DATABASE_URL or DEPLOY_HOOK_URL secret is set, so only the release artifact was built."
