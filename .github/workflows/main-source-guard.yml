# Team rule: main only receives pull requests from develop.
name: Main source guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  only-from-develop:
    name: Pull request comes from develop
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from develop in this repository (got '$HEAD_REF' from '$HEAD_REPO')."
            exit 1
          fi
