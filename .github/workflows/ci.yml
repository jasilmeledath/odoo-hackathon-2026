# Continuous integration. Runs on every pull request into develop or main, on every
# push to develop, and is reused by the deploy workflow before anything ships.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Prettier is not a project dependency, so pin it here to keep results stable.
      - run: npx --yes prettier@3.6.2 --check "client/src/**/*.{js,jsx}" "server/src/**/*.js" server/prisma/seed.js

  server:
    name: Server (migrate and test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: subscriptions_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d subscriptions_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/subscriptions_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      # Applying every migration to an empty database proves the schema and its
      # check constraints still build from scratch.
      - run: npx prisma migrate deploy
      - run: npm test

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
